# Companies whose public boards we'll poll on `python -m scripts.ingest_jobs`.
# Format: { source, external_org, company_name? }
# external_org is the board token, e.g. stripe.com/jobs -> board "stripe".
# No API keys required for any of these — all public JSON.
#
# Curated for the SDE-2/Senior backend persona: product companies, AI labs,
# dev-tooling, infra-native, and fintech with strong engineering culture.
#
# To add: drop a line here, rerun `python -m scripts.ingest_jobs --seed`.
# To disable: set enabled: false, or run /api/sources DELETE.

sources:
